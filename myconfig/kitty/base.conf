# macOS modern hacker profile (roomy, readable)

# Typography
font_family      Fira Code
italic_font      auto
bold_font        auto
bold_italic_font auto
font_size        13.5
modify_font      cell_height 115%
disable_ligatures never

# Route Nerd Font icon ranges to JetBrainsMono Nerd Font so glyphs like the
# branch icon (U+E702), bolt (U+F0E7), file icons, etc. render properly even
# though the primary font is plain Fira Code.
# Requires: brew install --cask font-jetbrains-mono-nerd-font
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CC-U+E0D2,U+E0D4,U+E5FA-U+E6B7,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF JetBrainsMono Nerd Font

# Layout and spacing
window_padding_width        2
single_window_padding_width 2
window_margin_width         4
window_border_width         2.0
remember_window_size        yes
enabled_layouts             splits,stack,tall,grid,fat:bias=66;full_size=1;mirrored=true

# Tab bar
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_edge          top
tab_bar_min_tabs      1
tab_bar_margin_width  10
tab_bar_margin_height 8 4
active_tab_font_style bold
# kitty 0.50+: {tab.program_status} shows the most urgent OSC 7501 status in the
# tab (blocked on you / failed / finished / working). Claude Code 2.1.295+
# reports it automatically — no hooks needed. Requires kitty >= 0.50.
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.program_status}{tab.last_focused_progress_percent}{title}"

# Cursor and scrollback
cursor_shape             beam
cursor_blink_interval    0
scrollback_lines         15000
scrollback_pager_history_size 64

# Behavior
term               xterm-kitty
shell              /opt/homebrew/bin/bash
open_url_with      default
mouse_hide_wait    2.5
clipboard_control  write-clipboard write-primary
allow_remote_control yes
listen_on unix:/tmp/kitty-main
# Per-profile border colors follow focus (borders are global in kitty).
watcher /Users/addelovein/.config/myconfig/kitty/profile_borders.py
confirm_os_window_close 0
enable_audio_bell  no
visual_bell_duration 0.0
startup_session    none

background                 #808080
background_opacity         1.0
dynamic_background_opacity no
background_blur            0
# Background image painted once behind the whole OS window (spans all splits).
background_image           /Users/addelovein/.config/kitty/backgrounds/red-hack-bg.jpg
background_image_layout    scaled
# Dim the background image so foreground text/colors stay strong.
# 0 = image full strength, 1 = image fully hidden behind cell bg.
background_tint            0.85
background_tint_gaps       1.0

# macOS tuning
macos_titlebar_color background
macos_option_as_alt no
macos_quit_when_last_window_closed no

# Force Ctrl-C to always send traditional interrupt byte (fixes CSI u / kitty keyboard protocol issues)
map ctrl+c send_text all \x03
map ctrl+d send_text all \x04

# Keep built-in defaults; add only a few convenience shortcuts.
map cmd+enter launch --type=background --allow-remote-control /Users/addelovein/.config/kitty/scripts/new-window-profile.sh
map cmd+shift+enter launch --type=window --location=vsplit --cwd=current
map cmd+t launch --type=background --allow-remote-control /Users/addelovein/.config/kitty/scripts/new-tab-profile.sh
map cmd+r start_resizing_window
map cmd+ctrl+left resize_window wider 3
map cmd+ctrl+right resize_window narrower 3
map cmd+ctrl+up resize_window taller 2
map cmd+ctrl+down resize_window shorter 2
map ctrl+shift+0 resize_window reset
map cmd+shift+r load_config_file
map cmd+, edit_config_file
map cmd+ctrl+f toggle_fullscreen
map ctrl+shift+z toggle_layout stack
map cmd+shift+j launch --type=background /Applications/kitty.app/Contents/MacOS/kitten quick-access-terminal
# Quick 25% side column (new pane gets ~25% width)
# Tab-wide right column (~25% width) in splits layout
map cmd+shift+o combine : goto_layout splits : launch --location=vsplit --bias 75 --cwd=current : layout_action move_to_screen_edge right : layout_action bias 25

# Color theme
include /Users/addelovein/.config/kitty/theme-hacker.conf

# Default tab colors (gray baseline)
tab_bar_background       #16191f
active_tab_background    #7f8792
active_tab_foreground    #f5f7fa
inactive_tab_background  #2c313a
inactive_tab_foreground  #b7bec8

# Ctrl+Shift+P then I: pick any file path on screen by hint, open it in the
# floating image panel (kfloat). Clicked image links do the same via
# ~/.config/kitty/open-actions.conf.
map ctrl+shift+p>i kitten hints --type path --program "launch --type=background /Users/addelovein/.config/myconfig/bin/kfloat --focus"
