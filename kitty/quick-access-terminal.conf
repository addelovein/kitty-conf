# Quick access terminal (quake-style) tuned for this setup.

edge top
lines 20
columns 160
margin_top 8
margin_left 14
margin_right 14
background_opacity 1.0
hide_on_focus_loss no
start_as_hidden no

# Do not launch the 5-pane startup session in the drop-down terminal.
kitty_override startup_session=none

# Keep the same look, but simpler and lighter for scratch usage.
kitty_override font_size=13.0
kitty_override tab_bar_style=hidden
kitty_override background=#000000
