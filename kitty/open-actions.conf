# open-actions.conf — what clicking a link in kitty does
# (https://sw.kovidgoyal.net/kitty/open_actions/). The first matching entry
# wins; links that match nothing open with open_url_with (the browser).

# Image URLs: download and show in a floating panel (kfloat). Any key shows
# the next image or closes it.
protocol https,http
url (?i).*\.(png|jpe?g|gif|webp|bmp|tiff?)
action launch --type=background $HOME/.config/myconfig/bin/kfloat --focus ${URL}

# Local image files (ls --hyperlink, file:// links): same floating panel.
protocol file
mime image/*
action launch --type=background $HOME/.config/myconfig/bin/kfloat --focus ${FILE_PATH}
